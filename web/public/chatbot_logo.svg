<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Circular black background -->
  <circle cx="256" cy="256" r="256" fill="#000000" />
  
  <!-- Outer Speech Bubble outline -->
  <path d="M 256,120 
           C 160,120 100,170 100,240 
           C 100,285 125,315 145,335 
           C 142,355 130,385 108,402 
           C 125,402 155,395 180,378 
           C 202,388 230,394 256,394 
           C 352,394 412,344 412,274 
           C 412,204 352,120 256,120 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Diagonal Dumbbell outline inside the bubble -->
  <g transform="translate(256, 252) rotate(-45) translate(-256, -252)">
    <!-- Dumbbell Central Bar -->
    <rect x="238" y="152" width="36" height="200" rx="10" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dumbbell Weight Plate - Top -->
    <rect x="186" y="112" width="140" height="40" rx="14" fill="#000000" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dumbbell Hand Grip / Smaller stopper detail (Inner top plate) -->
    <rect x="206" y="152" width="100" height="15" rx="5" fill="#000000" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dumbbell Weight Plate - Bottom -->
    <rect x="186" y="352" width="140" height="40" rx="14" fill="#000000" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dumbbell Inner bottom plate stopper detail -->
    <rect x="206" y="337" width="100" height="15" rx="5" fill="#000000" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
